# Keep rev in step with the ruff version locked in uv.lock (tests/unit/test_dependency_contract.py checks it).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
  # Same ty as make typecheck and CI (locked env); no rev to keep in step.
  # Whole project, because type errors cross files.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
        files: '\.pyi?$|^pyproject\.toml$'
