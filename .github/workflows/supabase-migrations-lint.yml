# ABOUTME: Lints supabase/migrations/* on every PR, against the PR base, so merged migrations stay append-only.
# ABOUTME: Holds no secrets and no environment; it only reads the repository and never talks to Supabase.
#
# Why this is a separate workflow: supabase-db-push.yml holds production
# credentials and must never have a pull_request trigger. This one is safe to
# run on pull_request (not pull_request_target) because it has no secrets,
# no environment and read-only permissions. Fork PRs run with a read-only
# token, which is all it needs.
name: supabase-migrations-lint

on:
  # No path filter: a path-filtered workflow never reports on other PRs, which
  # would leave a required check pending forever. With no migration changes the
  # lint still passes, so this is cheap on every PR.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the PR base
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
      # The linter is read from the base ref, not the PR checkout, so a PR cannot
      # weaken the append-only check by editing scripts/supabase_migrations.py in
      # the same change as a migration edit. Bootstrap: when the base has no
      # linter yet (the PR that introduces it), the PR's own copy is used, since
      # there is nothing trusted to run. That fallback ends once the script is on
      # the base. The workflow file itself is the PR's copy; protect it with
      # CODEOWNERS or required review (see docs/database-migrations.md).
      - name: Lint migrations against the base
        run: |
          trusted="${RUNNER_TEMP}/supabase_migrations_base.py"
          if git show "origin/${BASE_REF}:scripts/supabase_migrations.py" > "$trusted" 2>/dev/null; then
            echo "Using the linter from origin/${BASE_REF}"
          else
            echo "::warning::origin/${BASE_REF} has no scripts/supabase_migrations.py (bootstrap); using the PR copy"
            cp scripts/supabase_migrations.py "$trusted"
          fi
          python3 "$trusted" lint --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
