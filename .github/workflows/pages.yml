# ABOUTME: Publishes only mobile/ (the static dashboards) to GitHub Pages at https://mrsbohemian.github.io/Cholobots/.
# ABOUTME: The deploy job is skipped, with a visible notice, until the repository variable PAGES_ENABLED is 'true'.
#
# There is no build and no Jekyll: the artifact is the mobile/ folder as is, so
# nothing outside it (.claude/, docs/, scripts/) is ever published.
#
# Pages is switched on by hand after the story #64 PR merges (story #179 task
# #135: set the Pages source to "GitHub Actions", then set the repository
# variable PAGES_ENABLED to 'true'). Until then a run on main must stay green,
# so the deploy job is skipped and pages-disabled says why. Do not add
# `enablement: true` to configure-pages: it needs an admin token.
#
# Security: no pull_request trigger; the publish permissions exist on the deploy
# job only.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A Pages deploy that is already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  pages-disabled:
    if: vars.PAGES_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::GitHub Pages publishing is switched off (PAGES_ENABLED is not 'true'); see story #179 task #135."
