# ABOUTME: CI gate run on every pull request (any base, so stacked PRs too) and on pushes to main.
# ABOUTME: Mirrors `make check`: the uv.lock and requirements.txt check, py_compile, ruff, ty, unit tests, script pytest tests and every tests/scripts/test-*.sh, plus pyrefly as a non-failing step.
#
# The workflow and its job are both named "checks": branch protection requires the
# job name as a context, and scripts/monitor-pr-stability.sh matches those contexts
# against workflow-run names. Rename one and you must rename the other.
# No paths filter: a required context that never reports blocks the PR forever.
# The default workspace (/home/runner/work/...) matters: tests/scripts/test-taiga-wiki.sh
# fails when the checkout lives under /tmp.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.py raises at import without these, and chismebot, guardabot and
      # crudobot call create_client at import. Dummies only: no test talks to a
      # hosted service, and there is no .env on the runner.
      DISCORD_TOKEN: ci-dummy
      OPENAI_API_KEY: ci-dummy
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      # Use setup-python's interpreter; never download one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Read the uv pin
        id: pins
        # UV_VERSION lives only in .devcontainer/Dockerfile.prebuild; pins.sh reads it.
        run: |
          eval "$(scripts/devcontainer/pins.sh)"
          echo "uv=$UV_VERSION" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check shell-test tools
        run: make check-tools
      - name: Lockfile
        run: make lock-check
      - name: Compile
        run: python -m py_compile cholobots.py config.py db/database.py bots/*.py
      - name: Lint
        run: python -m ruff check --output-format=github .
      - name: Type check
        run: make typecheck
        env:
          # ty reads this: new errors show as PR annotations.
          TY_OUTPUT_FORMAT: github
      - name: Pyrefly (informational)
        # Spike #216: pyrefly reports but never fails the build; ty above is the gate.
        # A step, not a job: a new job would be a new check context next to the required checks/integration.
        # Plain text output: GitHub annotations from 300+ informational errors would bury ty's.
        continue-on-error: true
        run: make typecheck-pyrefly
      - name: Unit tests
        run: python -m pytest -q tests/unit
      - name: Script tests
        run: |
          python -m pytest -q tests/scripts
          for t in tests/scripts/test-*.sh; do echo "== $t"; bash "$t" || exit 1; done
