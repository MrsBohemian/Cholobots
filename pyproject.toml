[project]
name = "cholobots"
version = "0.1.0"
description = "Discord bot hosting the Cholobots personas for Handley Man"
requires-python = ">=3.14,<3.15"
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv==1.2.4",
    "openai==3.46.0",
    "supabase==2.34.1",
]

[dependency-groups]
# pytest-asyncio and psycopg are for tests/integration; the scripts tests are stdlib-only.
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "psycopg[binary]==3.3.6",
    "ruff==0.17.4",
    "pre-commit==4.7.0",
    "ty==0.0.105",
]

[tool.uv]
# An application: uv installs the dependencies into .venv but never builds or installs cholobots itself.
package = false

[tool.ty]
# Preview at the pinned ty version; no baseline, every diagnostic fails.
# discord.py, supabase, openai, python-dotenv, pytest, pytest-asyncio and psycopg ship inline types,
# so no allowed-unresolved-imports or replace-imports-with-any is needed.

[tool.ty.environment]
# python-version is stated here (matches requires-python and .python-version) rather than derived.
python-version = "3.14"
python-platform = "linux"
# tests/scripts put these on sys.path before importing the module under test.
extra-paths = ["scripts", "scripts/lib", "scripts/devcontainer"]

[tool.ty.terminal]
error-on-warning = true
